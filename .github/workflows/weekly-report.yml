name: crypto-signal-bot-weekly-report

on:
  schedule:
    - cron: "0 8 * * 1"
  workflow_dispatch: {}

jobs:
  report:
    runs-on: ubuntu-latest
    steps:
      - name: run weekly report endpoint
        run: |
          curl -sS -X GET "${{ secrets.VERCEL_WEEKLY_REPORT_URL }}" -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" --max-time 60 --fail
