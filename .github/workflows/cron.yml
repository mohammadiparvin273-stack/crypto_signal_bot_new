name: crypto-signal-bot-cron

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch: {}

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - name: run scan endpoint
        run: |
          curl -sS -X GET "${{ secrets.VERCEL_SCAN_URL }}" -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" --max-time 90 --fail
